<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ipon Local — Finance Tracker</title>
<meta name="description" content="A simple, private, local-first personal money tracker. Your data never leaves your browser.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/iconNoBG.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
  <img class="brand-mark" src="assets/icon.png" alt="Ipon Local Finance Tracker">
  <div class="brand-text">
    <span class="brand-name">Ipon Local</span>
    <span class="brand-subtitle">Finance Tracker</span>
  </div>
</div>

    <button type="button" id="sidebar-add-btn" class="button button-primary sidebar-add-btn">+ Add</button>

    <nav class="sidebar-nav">
      <button type="button" class="nav-button nav-button-active" data-view="dashboard">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/dashboardIcon.png" alt="dashboard icon" class="nav-icon-img">
        </span>
        Dashboard
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="transactions">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/transaction.png" alt="transaction icon" class="nav-icon-img">
        </span>
        Transactions
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="accounts">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/accounts.png" alt="account icon" class="nav-icon-img">
        </span>
        Accounts
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="planned">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/planned2.png" alt="planned expenses icon" class="nav-icon-img">
        </span>
        Planned Expenses
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="reserved">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/reserved.png" alt="reserved money icon" class="nav-icon-img">
        </span>
        Reserved Money
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="reports">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/reports.png" alt="reports icon" class="nav-icon-img">
        </span>
        Reports
      </button>
      <button type="button" class="nav-button nav-button-active" data-view="settings">
        <span class="nav-icon" aria-hidden="true">
          <img src="assets/personalization.png" alt="settings icon" class="nav-icon-img">
        </span>
        Personalization
      </button>
    </nav>

    <p class="sidebar-footnote">Stored only on this device. No account, no server, no tracking.</p>
  </aside>

  <main id="main-content" tabindex="-1">
    <section id="view-dashboard" class="view" aria-labelledby="dashboard-heading"></section>
    <section id="view-transactions" class="view" hidden></section>
    <section id="view-accounts" class="view" hidden></section>
    <section id="view-planned" class="view" hidden></section>
    <section id="view-reserved" class="view" hidden></section>
    <section id="view-reports" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
